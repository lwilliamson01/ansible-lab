- name: Windows baseline
  hosts: windows
  gather_facts: true
  tasks:
    - name: Show all facts
      debug:
        var: ansible_facts

    - name: Ensure Windows Update service is running
      ansible.windows.win_service:
        name: wuauserv
        state: started

    - name: Ensure Windows Firewall is enabled
      ansible.windows.win_firewall:
        state: enabled
        profiles:
          - Domain
          - Private
          - Public
